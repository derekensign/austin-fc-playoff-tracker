AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Hourly Austin FC playoff-forecast refresh. Pulls completed MLS results from the
  American Soccer Analysis feed, rebuilds the model snapshot, re-runs the
  simulation, and commits the output to GitHub so Vercel redeploys the site.

Parameters:
  GithubTokenSecretId:
    Type: String
    Description: >
      Secrets Manager secret holding a GitHub fine-grained PAT with
      contents:write on the tracker repository. Either a bare token or
      {"token":"ghp_..."}.
    Default: verde-run-in/github-token
  GithubOwner:
    Type: String
    Default: derekensign
  GithubRepo:
    Type: String
    Default: austin-fc-playoff-tracker
  GithubBranch:
    Type: String
    Default: main
  ScheduleExpression:
    Type: String
    Description: >
      How often to check for new results. The function is a cheap no-op when
      nothing has finished since the last run.
    Default: rate(1 hour)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    # The AWS SDK v3 that handler.js uses for Secrets Manager ships with the
    # nodejs22.x runtime, so this function needs no bundled dependencies.
    Timeout: 300
    # Single-threaded simulation: ~6s per 50,000-iteration run and refresh.js
    # does six of them, so buy a full vCPU rather than extra parallelism.
    MemorySize: 1769

Resources:
  RefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: verde-run-in-refresh
      Description: Ingest MLS results, re-simulate the run-in, publish to GitHub
      CodeUri: ./
      Handler: lambda/handler.handler
      Environment:
        Variables:
          GITHUB_TOKEN_SECRET_ID: !Ref GithubTokenSecretId
          GITHUB_OWNER: !Ref GithubOwner
          GITHUB_REPO: !Ref GithubRepo
          GITHUB_BRANCH: !Ref GithubBranch
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GithubTokenSecretId}-*
      Events:
        HourlyCheck:
          Type: Schedule
          Properties:
            Name: verde-run-in-hourly
            Description: Check for newly completed MLS matches
            Schedule: !Ref ScheduleExpression
      # Only the site payload and the code the function actually runs.
      # Everything else in the repo stays out of the deployment package.
      Tags:
        Project: verde-run-in

  # Alarm on failures, since an unattended job that quietly dies mid-run-in is
  # worse than one that never existed.
  RefreshFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: verde-run-in-refresh-errors
      AlarmDescription: The hourly playoff-forecast refresh is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RefreshFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 3
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  RefreshFunctionArn:
    Description: Refresh function ARN
    Value: !GetAtt RefreshFunction.Arn
  ManualInvokeCommand:
    Description: Force a refresh and publish, ignoring the no-change check
    Value: !Sub >-
      aws lambda invoke --function-name ${RefreshFunction}
      --payload '{"force":true}' --cli-binary-format raw-in-base64-out /dev/stdout
